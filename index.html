<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N5 Imobiliário · O sistema operativo da tua agência</title>
    <meta name="description" content="Do primeiro contacto à comissão paga, num só sítio. Lançamento a 1 de dezembro. 25 licenças com 50% de desconto durante 12 mensalidades e 12 formações por ano para quem está na lista de espera da pré-venda." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- formulário escondido para o Netlify Forms detetar os campos no build -->
    <form name="pre-venda" data-netlify="true" netlify-honeypot="empresa-site" hidden>
      <input name="nome" /><input name="email" /><input name="telefone" />
      <input name="agencia" /><input name="ami" /><input name="consultores" /><input name="consentimento" />
      <input name="empresa-site" />
    </form>
    <form name="demonstracao" data-netlify="true" netlify-honeypot="empresa-site" hidden>
      <input name="nome" /><input name="email" /><input name="telefone" />
      <input name="agencia" /><input name="ami" /><input name="consultores" /><input name="consentimento" />
      <input name="empresa-site" />
    </form>
    <form name="prioridades" data-netlify="true" netlify-honeypot="empresa-site" hidden>
      <input name="email" /><input name="prioridades" /><input name="crm" /><input name="empresa-site" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
